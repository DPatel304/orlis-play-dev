<title>Orlis 3D Look</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Look: one palette sampled from Last Known Position. Layout: a full-screen 3D stage with a stats card top-left and controls along the bottom. */
:root{
  --ink:#2a2b32; --panel:rgba(247,244,235,.9); --line:rgba(42,43,50,.18);
  --accent:#3a8474; --accent-ink:#f7f4eb; --muted:#5d6068; --warn:#c2410c;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#e7e8e1; --panel:rgba(32,33,40,.9); --line:rgba(231,232,225,.18); --accent:#8fc7a8; --accent-ink:#1d1e24; --muted:#a9acb4; color-scheme:dark; }
}
:root[data-theme="dark"]{ --ink:#e7e8e1; --panel:rgba(32,33,40,.9); --line:rgba(231,232,225,.18); --accent:#8fc7a8; --accent-ink:#1d1e24; --muted:#a9acb4; color-scheme:dark; }
html,body{ height:100%; }
body{ margin:0; background:#d9dedf; color:var(--ink); font:13px/1.35 var(--font); overflow:hidden; }
#stage{ position:fixed; inset:0; touch-action:none; }
#stage canvas{ display:block; width:100%; height:100%; }
.panel{ position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
#hud{ top:max(10px,env(safe-area-inset-top,0px)); left:max(16px,env(safe-area-inset-left,0px)); min-width:190px; max-width:calc(100vw - 32px); }
#hud h1{ margin:0 0 4px; font:700 14px/1.2 var(--font); letter-spacing:.01em; }
#hud .big{ font:700 26px/1 var(--font); font-variant-numeric:tabular-nums; }
#hud .big small{ font:500 12px var(--font); color:var(--muted); margin-left:4px; }
#hud dl{ display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:6px 0 0; font-variant-numeric:tabular-nums; }
#hud dt{ color:var(--muted); } #hud dd{ margin:0; text-align:right; }
#bar{ left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px)); bottom:max(10px,env(safe-area-inset-bottom,0px)); display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
.grp{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.grp > span{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-right:2px; }
button{ font:600 12px var(--font); color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px 10px; cursor:pointer; min-height:34px; }
button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
button.go{ border-color:var(--accent); }
#results{ top:max(10px,env(safe-area-inset-top,0px)); right:max(16px,env(safe-area-inset-right,0px)); max-width:min(360px,calc(100vw - 250px)); display:none; }
#results.on{ display:block; }
#results table{ border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
#results th,#results td{ text-align:right; padding:2px 6px; } #results th:first-child,#results td:first-child{ text-align:left; }
#results th{ color:var(--muted); font-weight:600; font-size:11px; }
#results pre{ white-space:pre-wrap; margin:6px 0 0; font:11px/1.3 ui-monospace,Menlo,Consolas,monospace; color:var(--muted); }
#results .row{ display:flex; gap:6px; margin-top:8px; }
#msg{ color:var(--warn); margin-top:6px; }
@media (max-width:640px){ #results{ top:auto; right:max(16px,env(safe-area-inset-right,0px)); left:max(16px,env(safe-area-inset-left,0px)); bottom:150px; max-width:none; } }
@media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto; } }
</style>

<div id="stage" aria-label="3D scene"></div>

<div class="panel" id="hud" aria-live="off">
  <h1>Orlis 3D look, round 2</h1>
  <div class="big"><span id="fps">--</span><small>frames/s</small></div>
  <dl>
    <dt>Frame</dt><dd id="ms">--</dd>
    <dt>Slowest</dt><dd id="worst">--</dd>
    <dt>Draw calls</dt><dd id="calls">--</dd>
    <dt>Triangles</dt><dd id="tris">--</dd>
    <dt>Pixels</dt><dd id="px">--</dd>
  </dl>
  <div id="msg" hidden></div>
</div>

<div class="panel" id="results" role="region" aria-label="Benchmark results"></div>

<div class="panel" id="bar">
  <div class="grp" id="gcam"><span>Camera</span>
    <button data-cam="three" aria-pressed="true">Three-quarter</button>
    <button data-cam="top" aria-pressed="false">Top-down</button>
    <button data-cam="side" aria-pressed="false">Side-on</button>
    <button data-cam="behind" aria-pressed="false">Behind</button>
  </div>
  <div class="grp" id="gload"><span>Busy-ness</span>
    <button data-load="1" aria-pressed="true">&times;1</button>
    <button data-load="4" aria-pressed="false">&times;4</button>
    <button data-load="16" aria-pressed="false">&times;16</button>
  </div>
  <div class="grp"><span>Quality</span>
    <button id="bShadow" aria-pressed="true">Shadows</button>
    <button id="bPix" aria-pressed="true">Full pixels</button>
  </div>
  <div class="grp"><button class="go" id="bBench">Run 12-second test</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- the one palette (sampled from Last Known Position) ---------- */
const C = {
  haze:0xd9dedf, skyTop:0x9fbdd0, sage:0x82a573, lime:0x96b778, sageLight:0xadc1a4, mint:0xaeccbc, teal:0x3a8474, seaGreen:0x609d80,
  sand:0xc8b48f, sandDark:0xb7a483, sandLight:0xd2c19a, slate:0x807f8f, mauve:0x72677d, blue:0x4d607a, fog:0x9ca3b0,
  charcoal:0x2a2b32, cream:0xf7f4eb, trunk:0x6e5b49,
  /* accents: clearly more saturated than the world, for things you touch (Katamari rule) */
  red:0xff5b5b, yellow:0xffd24a, cyan:0x3fd0ff, orange:0xff8a3d, pink:0xff7ab8, violet:0x9b82ff
};
const rng = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(7);
const mats = {};
const M = (hex) => mats[hex] || (mats[hex] = new THREE.MeshPhongMaterial({ color: hex, flatShading: true, shininess: 0, specular: 0x000000 }));
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* ---------- renderer, scene, light ---------- */
const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
catch (e) { const m = document.getElementById('msg'); m.hidden = false; m.textContent = 'This browser could not start 3D graphics (WebGL).'; return; }
stage.appendChild(renderer.domElement);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.haze);
scene.fog = new THREE.Fog(C.haze, 40, 170);

/* sky: a gradient dome that fades into the haze */
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 24, 12), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0xb3cddd) }, low: { value: new THREE.Color(C.haze) } },
  vertexShader: 'varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 low; varying float h; void main(){ gl_FragColor = vec4(mix(low, top, smoothstep(0.02, 0.55, h)), 1.0); }'
}));
scene.add(sky);

/* Round 2: mostly ambient light, so facets barely differ and shadows stay soft; shapes are chunky and rounded, never bare primitives. */
scene.add(new THREE.HemisphereLight(0xf1f3f5, 0xc9c2b4, 0.95));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.3);
sun.position.set(-18, 30, 16); sun.castShadow = true;
sun.shadow.camera.left = -26; sun.shadow.camera.right = 26; sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26; sun.shadow.camera.near = 5; sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0006; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const hgt = (x, z) => { const d = Math.hypot(x, z), k = smooth(9, 30, d); return k * (Math.sin(x * .07) * 1.9 + Math.cos(z * .05 + 1) * 1.7 + Math.sin((x + z) * .025) * 3.4); };
(function ground(){
  const g = new THREE.PlaneGeometry(440, 440, 110, 110); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), a = new THREE.Color(C.sage), b = new THREE.Color(C.lime), s2 = new THREE.Color(C.sageLight), t = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i); p.setY(i, hgt(x, z));
    const n = (Math.sin(x * .09) + Math.cos(z * .07) + Math.sin((x - z) * .05)) / 3 * .5 + .5;
    t.copy(a).lerp(b, n * .8); t.lerp(s2, smooth(1.5, 6, p.getY(i)) * .5);
    col[i * 3] = t.r; col[i * 3 + 1] = t.g; col[i * 3 + 2] = t.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })); m.receiveShadow = true; scene.add(m);
})();

/* ---------- the kit, round 2: smooth, rounded, chunky ---------- */
const sm = {};
const S = (hex) => sm[hex] || (sm[hex] = new THREE.MeshLambertMaterial({ color: hex }));
const mesh = (geo, hex, x = 0, y = 0, z = 0, s = [1, 1, 1], flat = false) => { const m = new THREE.Mesh(geo, flat ? M(hex) : S(hex)); m.position.set(x, y, z); m.scale.set(s[0], s[1], s[2]); m.castShadow = true; m.receiveShadow = true; return m; };
function rbox(w, h, d, r = .08){
  const sh = new THREE.Shape(), x = -(w - 2 * r) / 2, y = -(h - 2 * r) / 2, ww = w - 2 * r, hh = h - 2 * r;
  sh.moveTo(x, y); sh.lineTo(x + ww, y); sh.lineTo(x + ww, y + hh); sh.lineTo(x, y + hh); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: Math.max(.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 3, curveSegments: 4 });
  g.translate(0, 0, -(d - 2 * r) / 2); return g;
}
function capsule(r, len){ const pts = [], n = 6; for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + i / n * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, -len / 2 + Math.sin(a) * r)); } for (let i = 0; i <= n; i++) { const a = i / n * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, len / 2 + Math.sin(a) * r)); } return new THREE.LatheGeometry(pts, 14); }
const tube = (pts, r, seg = 24) => new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), seg, r, 10, false);
const G = {
  ico1: new THREE.IcosahedronGeometry(1, 1), dodeca: new THREE.DodecahedronGeometry(1, 0), box: new THREE.BoxGeometry(1, 1, 1),
  cyl8: new THREE.CylinderGeometry(1, 1, 1, 10), cone7: new THREE.ConeGeometry(1, 1, 7), sph: new THREE.SphereGeometry(1, 20, 14),
  discs: new THREE.CylinderGeometry(1, 1, 1, 18)
};
function tree(h = 1){
  const g = new THREE.Group();
  g.add(mesh(tube([[0, 0, 0], [.08 * h, 1 * h, .05 * h], [-.05 * h, 2 * h, 0]], .17 * h, 12), C.trunk));
  g.add(mesh(G.ico1, C.seaGreen, 0, 2.15 * h, 0, [1.35 * h, 1.1 * h, 1.3 * h], true));
  g.add(mesh(G.ico1, C.sage, .55 * h, 2.9 * h, .15 * h, [.95 * h, .85 * h, .9 * h], true));
  g.add(mesh(G.ico1, C.lime, -.5 * h, 3.05 * h, -.1 * h, [.8 * h, .72 * h, .78 * h], true));
  return g;
}
function pine(h = 1){
  const g = new THREE.Group();
  g.add(mesh(G.cyl8, C.trunk, 0, .4 * h, 0, [.15 * h, .8 * h, .15 * h]));
  [[1.35, 1.5, 1.3, C.teal], [1.05, 1.4, 2.2, C.seaGreen], [.72, 1.2, 3.05, C.sage]].forEach(([r, hh, y, c]) => g.add(mesh(G.cone7, c, 0, y * h, 0, [r * h, hh * h, r * h], true)));
  return g;
}
function rock(s = 1){
  const g = new THREE.Group();
  g.add(mesh(G.ico1, rng() < .5 ? C.slate : C.mauve, 0, .5 * s, 0, [1.2 * s, .78 * s, 1 * s], true));
  g.add(mesh(G.ico1, C.sage, .05 * s, .98 * s, 0, [.78 * s, .2 * s, .66 * s], true));
  return g;
}
function bush(s = 1){ const g = new THREE.Group(); g.add(mesh(G.ico1, C.seaGreen, 0, .5 * s, 0, [.9 * s, .65 * s, .85 * s], true)); g.add(mesh(G.ico1, C.sage, .6 * s, .35 * s, .2 * s, [.55 * s, .45 * s, .55 * s], true)); return g; }
function balloon(hex){
  const g = new THREE.Group();
  g.add(mesh(G.sph, hex, 0, 0, 0, [.55, .68, .55]));
  g.add(mesh(G.cone7, hex, 0, -.74, 0, [.1, .15, .1]).rotateX(Math.PI));
  const st = mesh(G.cyl8, C.charcoal, 0, -1.8, 0, [.014, 2.0, .014]); st.castShadow = false; g.add(st);
  return g;
}
/* Cubo: a big rounded cube head, a chubby body, short round limbs */
function cubo(){
  const g = new THREE.Group(), skin = 0x8fa6ff, body = C.blue;
  const head = new THREE.Group(); head.position.y = 1.75; g.add(head);
  head.add(mesh(rbox(1.15, 1.05, 1.05, .2), skin));
  head.add(mesh(rbox(.86, .66, .06, .03), 0xdbe6ff, 0, -.02, .53));
  [-.2, .2].forEach(x => head.add(mesh(G.sph, 0x2a2160, x, .05, .575, [.07, .11, .03])));
  head.add(mesh(G.sph, 0x2a2160, 0, -.17, .575, [.09, .055, .03]));
  g.userData.head = head;
  g.add(mesh(capsule(.3, .35), body, 0, .85, 0));
  const mkArm = (side) => { const a = new THREE.Group(); a.position.set(side * .3, 1.0, 0); const arm = mesh(capsule(.09, .5), body, side * .26, .1, 0); arm.rotation.z = -side * 1.0; a.add(arm); a.add(mesh(G.sph, skin, side * .55, .28, 0, [.13, .13, .13])); return a; };
  const aL = mkArm(-1), aR = mkArm(1); g.add(aL, aR); g.userData.arms = [aL, aR];
  [-.16, .16].forEach(x => { g.add(mesh(capsule(.1, .42), body, x, .32, 0)); g.add(mesh(rbox(.28, .13, .4, .05), skin, x, .07, .07)); });
  return g;
}
function giraffe(){
  const g = new THREE.Group(), Y = C.yellow, B = 0xa8642f;
  g.add(mesh(G.sph, Y, 0, 2.35, 0, [1.15, .62, .6]));
  [[-.72, -.3], [-.72, .3], [.72, -.3], [.72, .3]].forEach(([x, z]) => { g.add(mesh(capsule(.12, 1.7), Y, x, 1.15, z)); g.add(mesh(G.sph, C.charcoal, x, .12, z, [.15, .1, .16])); });
  const neck = new THREE.Group(); neck.position.set(.8, 2.6, 0); g.add(neck);
  neck.add(mesh(tube([[0, 0, 0], [.18, 1.0, 0], [.1, 2.0, 0], [.3, 2.9, 0]], .2, 20), Y));
  const head = new THREE.Group(); head.position.set(.38, 3.0, 0); neck.add(head);
  head.add(mesh(G.sph, Y, .1, 0, 0, [.38, .3, .28]));
  head.add(mesh(G.sph, C.sandLight, .42, -.05, 0, [.2, .17, .2]));
  head.add(mesh(G.sph, C.charcoal, .6, -.03, 0, [.05, .04, .05]));
  [-.13, .13].forEach(z => { head.add(mesh(capsule(.04, .25), C.sandDark, 0, .42, z)); head.add(mesh(G.sph, C.charcoal, 0, .62, z, [.07, .07, .07])); head.add(mesh(G.sph, C.charcoal, .3, .08, z * 1.25, [.045, .055, .035])); });
  head.add(mesh(G.sph, Y, -.2, .18, .27, [.14, .07, .06])); head.add(mesh(G.sph, Y, -.2, .18, -.27, [.14, .07, .06]));
  const sp = rng; for (let i = 0; i < 12; i++) { const x = (sp() - .5) * 1.7, y = 2.3 + sp() * .45, side = sp() < .5 ? 1 : -1; g.add(mesh(G.sph, B, x, y, side * .52, [.2, .17, .05])); }
  for (let i = 0; i < 6; i++) neck.add(mesh(G.sph, B, .12 + (i % 3) * .05, .3 + i * .45, (i % 2 ? 1 : -1) * .17, [.13, .13, .05]));
  g.add(mesh(tube([[0, 0, 0], [-.3, -.4, 0], [-.4, -1.0, 0]], .04, 12), B, -1.05, 2.45, 0)); g.add(mesh(G.sph, B, -1.45, 1.45, 0, [.1, .16, .1]));
  g.userData.neck = neck; return g;
}
function pot(){
  const g = new THREE.Group(), pts = [[.0, 0], [.42, 0], [.5, .1], [.62, .75], [.56, .85], [.0, .85]].map(p => new THREE.Vector2(p[0], p[1]));
  g.add(mesh(new THREE.LatheGeometry(pts, 14), 0xe0705a));
  g.add(mesh(G.sph, C.trunk, 0, .82, 0, [.52, .1, .52]));
  for (let i = 0; i < 7; i++) { const a = i / 7 * 6.28, m = mesh(G.ico1, i % 2 ? C.seaGreen : C.sage, Math.cos(a) * .4, 1.05, Math.sin(a) * .4, [.28, .14, .2], true); m.rotation.y = -a; m.rotation.z = .5; g.add(m); }
  [[C.pink, .0, 1.3, .1], [C.yellow, .3, 1.2, -.2], [C.cream, -.3, 1.25, .15]].forEach(([c, x, y, z]) => g.add(mesh(G.sph, c, x, y, z, [.13, .1, .13])));
  return g;
}
function fence(n = 6){
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) { g.add(mesh(rbox(.34, 1.5, .1, .04), 0xa8805a, i * .46, .75, 0)); }
  g.add(mesh(rbox(n * .46 + .1, .12, .12, .04), 0x8c6a48, (n - 1) * .23, .5, -.1)); g.add(mesh(rbox(n * .46 + .1, .12, .12, .04), 0x8c6a48, (n - 1) * .23, 1.1, -.1));
  return g;
}
function slabs(){
  /* tidy paving: rows of rounded slabs with small gaps, like the Goose Game paths */
  const g = new THREE.Group(), cols = [C.sandDark, C.sand, C.sandLight, 0xa9a38f];
  for (let row = -4; row <= 4; row++) {
    let x = -9 - (row % 2 ? 1.1 : 0);
    while (x < 9) {
      const w = 1.9 + rng() * .9, cx = x + w / 2, cz = row * 2.1;
      if (Math.hypot(cx, cz) < 8.6) { const m = mesh(rbox(w - .16, .16, 1.9, .06), cols[(rng() * cols.length) | 0], cx, .06 + rng() * .025, cz); m.castShadow = false; g.add(m); }
      x += w;
    }
  }
  return g;
}

const hero = new THREE.Group(); scene.add(hero);
hero.add(slabs());
const place = (o, x, z, ry = 0, s = 1) => { o.position.set(x, hgt(x, z), z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const hCubo = place(cubo(), -2.2, 2.4, .35, 1.1); hero.add(hCubo);
const hGir = place(giraffe(), 4.2, -1.2, -.5); hero.add(hGir);
hero.add(place(rock(1.5), -6.2, -2.6, 1));
hero.add(place(tree(1.15), 8.2, -3.6, 0));
hero.add(place(pine(1.1), -8, 3.8, 0));
hero.add(place(bush(1.2), 1.8, -4.6, 0));
hero.add(place(pot(), 1.4, 4.2, 0));
hero.add(place(pot(), -5, 4.6, 1));
hero.add(place(fence(8), -3.2, -6.4, 0));
const balls = [C.red, C.yellow, C.cyan, C.orange, C.pink].map((c, i) => { const b = balloon(c); b.position.set(-5 + i * 2.3, 4.2 + (i % 2) * 1.1, 0.8 - (i % 3) * 1.6); b.userData.ph = i * 1.3; b.userData.y0 = b.position.y; hero.add(b); return b; });

const scenery = new THREE.Group(); scene.add(scenery);
const kinds = [() => tree(.8 + rng() * .8), () => pine(.8 + rng() * .9), () => rock(.6 + rng() * 1.3), () => bush(.8 + rng() * .6)];
function scatter(parent, n, rMin, rMax){
  for (let i = 0; i < n; i++) {
    const a = rng() * 6.2832, r = rMin + rng() * (rMax - rMin), x = Math.cos(a) * r, z = Math.sin(a) * r;
    parent.add(place(kinds[(rng() * kinds.length) | 0](), x, z, rng() * 6.28));
  }
}
scatter(scenery, 70, 11, 110);
for (let i = 0; i < 16; i++) { const a = i / 16 * 6.2832 + rng() * .3, r = 190 + rng() * 40, s2 = 22 + rng() * 22, m = mesh(G.cone7, i % 2 ? C.fog : C.slate, Math.cos(a) * r, s2 * .45, Math.sin(a) * r, [s2 * .9, s2 * 1.1, s2 * .9], true); m.castShadow = false; scenery.add(m); }
const extras = new THREE.Group(); scene.add(extras);
function setLoad(n){
  while (extras.children.length) extras.remove(extras.children[0]);
  scatter(extras, (n - 1) * 60, 7, 48);
  state.load = n;
}

/* ---------- cameras: same world, four ways to look at it ---------- */
const cams = {
  three: () => { const c = new THREE.PerspectiveCamera(42, aspect(), .5, 600); c.position.set(9, 5.6, 14.5); c.lookAt(0, 1.9, 0); return [c, 40, 170]; },
  behind: () => { const c = new THREE.PerspectiveCamera(55, aspect(), .5, 600); c.position.set(-2.2, 3.6, 8.5); c.lookAt(-1, 2.4, -14); return [c, 30, 150]; },
  top: () => { const v = 11, c = new THREE.OrthographicCamera(-v * aspect(), v * aspect(), v, -v, 25, 600); c.position.set(0, 60, .001); c.lookAt(0, 0, 0); return [c, 200, 500]; },
  side: () => { const v = 6.2, c = new THREE.OrthographicCamera(-v * aspect(), v * aspect(), v, -v, 38, 600); c.position.set(0, 3.4, 60); c.lookAt(0, 3.4, 0); return [c, 120, 400]; }
};
function aspect(){ return stage.clientWidth / Math.max(1, stage.clientHeight); }
const state = { cam: 'three', load: 1, shadows: true, full: true };
let camera;
function setCam(k){ const [c, fn, ff] = cams[k](); camera = c; scene.fog.near = fn; scene.fog.far = ff; state.cam = k; document.querySelectorAll('[data-cam]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cam === k))); }
function setPix(){
  const dpr = state.full ? Math.min(window.devicePixelRatio || 1, 2) : 1;
  renderer.setPixelRatio(dpr); renderer.setSize(stage.clientWidth, stage.clientHeight, false);
  document.getElementById('px').textContent = Math.round(stage.clientWidth * dpr) + '×' + Math.round(stage.clientHeight * dpr);
}
function resize(){ setPix(); setCam(state.cam); }
window.addEventListener('resize', resize);

/* ---------- stats ---------- */
const ft = []; let rec = null, lastT = performance.now(), acc = 0, frames = 0, shown = 0;
function pct(a, p){ if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; }
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - lastT) / 1000), ms = now - lastT; lastT = now;
  const t = now / 1000;
  hCubo.userData.head.position.y = 2.15 + Math.sin(t * 3) * .05; hCubo.userData.head.rotation.y = Math.sin(t * 1.4) * .35;
  hCubo.userData.arms.forEach((a, i) => { a.rotation.z = Math.sin(t * 4 + i * 2) * .35; });
  hGir.userData.neck.rotation.z = Math.sin(t * .9) * .09;
  balls.forEach(b => { b.position.y = b.userData.y0 + Math.sin(t * 1.2 + b.userData.ph) * .25; b.rotation.z = Math.sin(t * 1.5 + b.userData.ph) * .08; });
  renderer.render(scene, camera);
  ft.push(ms); if (ft.length > 120) ft.shift();
  if (rec) rec.push(ms);
  acc += ms; frames++;
  if (acc > 500) {
    const avg = acc / frames, w = pct(ft, .95);
    document.getElementById('fps').textContent = (1000 / avg).toFixed(0);
    document.getElementById('ms').textContent = avg.toFixed(1) + ' ms';
    document.getElementById('worst').textContent = w.toFixed(1) + ' ms';
    document.getElementById('calls').textContent = renderer.info.render.calls;
    document.getElementById('tris').textContent = renderer.info.render.triangles.toLocaleString();
    acc = 0; frames = 0;
  }
}

/* ---------- controls ---------- */
document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => setCam(b.dataset.cam)));
document.querySelectorAll('[data-load]').forEach(b => b.addEventListener('click', () => { setLoad(+b.dataset.load); document.querySelectorAll('[data-load]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
const bS = document.getElementById('bShadow'), bP = document.getElementById('bPix');
bS.addEventListener('click', () => { state.shadows = !state.shadows; renderer.shadowMap.enabled = state.shadows; sun.castShadow = state.shadows; Object.values(mats).concat(Object.values(sm)).forEach(m => m.needsUpdate = true); bS.setAttribute('aria-pressed', String(state.shadows)); });
bP.addEventListener('click', () => { state.full = !state.full; setPix(); bP.setAttribute('aria-pressed', String(state.full)); });

/* the test: three busy-ness levels, four seconds each, in the current camera and quality settings */
let running = false;
document.getElementById('bBench').addEventListener('click', async () => {
  if (running) return; running = true;
  const btn = document.getElementById('bBench'), box = document.getElementById('results'); btn.disabled = true;
  const rows = [], dbg = renderer.getContext().getExtension('WEBGL_debug_renderer_info');
  const gpu = dbg ? renderer.getContext().getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'hidden by the browser';
  box.classList.add('on'); box.textContent = 'Testing... keep this tab in front.';
  for (const n of [1, 4, 16]) {
    setLoad(n); document.querySelectorAll('[data-load]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.load === n)));
    await new Promise(r => setTimeout(r, 700)); rec = [];
    await new Promise(r => setTimeout(r, 3300));
    const a = rec; rec = null; const avg = a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
    rows.push({ n, fps: 1000 / avg, p95: pct(a, .95), worst: Math.max(...a), calls: renderer.info.render.calls, tris: renderer.info.render.triangles });
  }
  const px = document.getElementById('px').textContent;
  const text = ['Orlis 3D spike result', 'GPU: ' + gpu, 'Screen render: ' + px + ', camera: ' + state.cam + ', shadows: ' + (state.shadows ? 'on' : 'off') + ', full pixels: ' + (state.full ? 'yes' : 'no'), 'Browser: ' + navigator.userAgent.slice(0, 120)]
    .concat(rows.map(r => 'x' + r.n + ': ' + r.fps.toFixed(0) + ' fps, slowest 5% over ' + r.p95.toFixed(1) + ' ms, worst ' + r.worst.toFixed(0) + ' ms, ' + r.calls + ' calls, ' + r.tris.toLocaleString() + ' triangles')).join('\n');
  box.innerHTML = '<table><thead><tr><th>Busy-ness</th><th>fps</th><th>5% slowest</th><th>calls</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>&times;' + r.n + '</td><td>' + r.fps.toFixed(0) + '</td><td>' + r.p95.toFixed(1) + ' ms</td><td>' + r.calls + '</td></tr>').join('') + '</tbody></table><pre></pre><div class="row"><button id="bCopy">Copy results</button><button id="bClose">Close</button></div>';
  box.querySelector('pre').textContent = text;
  box.querySelector('#bClose').onclick = () => box.classList.remove('on');
  box.querySelector('#bCopy').onclick = async (e) => { try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied'; } catch (_) { const r = document.createRange(); r.selectNodeContents(box.querySelector('pre')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent = 'Selected: copy it'; } };
  setLoad(1); document.querySelectorAll('[data-load]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.load === 1)));
  btn.disabled = false; running = false;
});

resize(); setLoad(1); requestAnimationFrame(loop);
window.__spike = { setCam, setLoad, state, renderer, scene };
})();
</script>
