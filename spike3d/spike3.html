<title>Orlis Balloon Pop Look</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Look: one palette sampled from Last Known Position. Layout: a full-screen 3D stage with a stats card top-left and controls along the bottom. */
:root{
  --ink:#2a2b32; --panel:rgba(247,244,235,.9); --line:rgba(42,43,50,.18);
  --accent:#3a8474; --accent-ink:#f7f4eb; --muted:#5d6068; --warn:#c2410c;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#e7e8e1; --panel:rgba(32,33,40,.9); --line:rgba(231,232,225,.18); --accent:#8fc7a8; --accent-ink:#1d1e24; --muted:#a9acb4; color-scheme:dark; }
}
:root[data-theme="dark"]{ --ink:#e7e8e1; --panel:rgba(32,33,40,.9); --line:rgba(231,232,225,.18); --accent:#8fc7a8; --accent-ink:#1d1e24; --muted:#a9acb4; color-scheme:dark; }
html,body{ height:100%; }
body{ margin:0; background:#d9dedf; color:var(--ink); font:13px/1.35 var(--font); overflow:hidden; }
#stage{ position:fixed; inset:0; touch-action:none; }
#stage canvas{ display:block; width:100%; height:100%; }
.panel{ position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
#hud{ top:max(10px,env(safe-area-inset-top,0px)); left:max(16px,env(safe-area-inset-left,0px)); min-width:190px; max-width:calc(100vw - 32px); }
#hud h1{ margin:0 0 4px; font:700 14px/1.2 var(--font); letter-spacing:.01em; }
#hud .big{ font:700 26px/1 var(--font); font-variant-numeric:tabular-nums; }
#hud .big small{ font:500 12px var(--font); color:var(--muted); margin-left:4px; }
#hud dl{ display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:6px 0 0; font-variant-numeric:tabular-nums; }
#hud dt{ color:var(--muted); } #hud dd{ margin:0; text-align:right; }
#bar{ left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px)); bottom:max(10px,env(safe-area-inset-bottom,0px)); display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
.grp{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.grp > span{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-right:2px; }
button{ font:600 12px var(--font); color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px 10px; cursor:pointer; min-height:34px; }
button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
button.go{ border-color:var(--accent); }
#results{ top:max(10px,env(safe-area-inset-top,0px)); right:max(16px,env(safe-area-inset-right,0px)); max-width:min(360px,calc(100vw - 250px)); display:none; }
#results.on{ display:block; }
#results table{ border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
#results th,#results td{ text-align:right; padding:2px 6px; } #results th:first-child,#results td:first-child{ text-align:left; }
#results th{ color:var(--muted); font-weight:600; font-size:11px; }
#results pre{ white-space:pre-wrap; margin:6px 0 0; font:11px/1.3 ui-monospace,Menlo,Consolas,monospace; color:var(--muted); }
#results .row{ display:flex; gap:6px; margin-top:8px; }
#msg{ color:var(--warn); margin-top:6px; }
@media (max-width:640px){ #results{ top:auto; right:max(16px,env(safe-area-inset-right,0px)); left:max(16px,env(safe-area-inset-left,0px)); bottom:150px; max-width:none; } }
@media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto; } }

<div id="stage" aria-label="Balloon Pop in the new 3D look"></div>
<div class="panel" id="hud">
  <h1>Balloon Pop, new look</h1>
  <div class="big"><span id="fps">--</span><small>frames/s</small></div>
  <dl><dt>Draw calls</dt><dd id="calls">--</dd><dt>Triangles</dt><dd id="tris">--</dd><dt>Balloons popped</dt><dd id="popped">0</dd></dl>
  <div id="msg" hidden></div>
  <p style="margin:8px 0 0;color:var(--muted);max-width:210px">Sweep the mouse (or a finger) over the balloons. Click once to turn sound on.</p>
</div>
<div class="panel" id="results" role="region" aria-label="Test results"></div>
<div class="panel" id="bar">
  <div class="grp"><span>View</span>
    <button data-cam="flat" aria-pressed="true">Flat (the game)</button>
    <button data-cam="peek" aria-pressed="false">Peek behind it</button>
  </div>
  <div class="grp"><button class="go" id="bBench">Run 8-second test</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- the one palette (sampled from Last Known Position) ---------- */
const C = {
  haze:0xd9dedf, skyTop:0x9fbdd0, sage:0x82a573, lime:0x96b778, sageLight:0xadc1a4, mint:0xaeccbc, teal:0x3a8474, seaGreen:0x609d80,
  sand:0xc8b48f, sandDark:0xb7a483, sandLight:0xd2c19a, slate:0x807f8f, mauve:0x72677d, blue:0x4d607a, fog:0x9ca3b0,
  charcoal:0x2a2b32, cream:0xf7f4eb, trunk:0x6e5b49,
  /* accents: clearly more saturated than the world, for things you touch (Katamari rule) */
  red:0xff5b5b, yellow:0xffd24a, cyan:0x3fd0ff, orange:0xff8a3d, pink:0xff7ab8, violet:0x9b82ff
};
const rng = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(7);
const mats = {};
const M = (hex) => mats[hex] || (mats[hex] = new THREE.MeshPhongMaterial({ color: hex, flatShading: true, shininess: 0, specular: 0x000000 }));
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };


const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
catch (e) { const m = document.getElementById('msg'); m.hidden = false; m.textContent = 'This browser could not start 3D graphics (WebGL).'; return; }
stage.appendChild(renderer.domElement);
/* a flat game needs no shadow maps at all: the cheap path */
renderer.shadowMap.enabled = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.haze);
scene.fog = new THREE.Fog(C.haze, 70, 190);
const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 24, 12), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0xa9c6d9) }, low: { value: new THREE.Color(C.haze) } },
  vertexShader: 'varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 low; varying float h; void main(){ gl_FragColor = vec4(mix(low, top, smoothstep(0.0, 0.5, h)), 1.0); }'
}));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0xf1f3f5, 0xc9c2b4, 1.0));
const sunL = new THREE.DirectionalLight(0xfff4e0, 0.25); sunL.position.set(-18, 30, 30); scene.add(sunL);

/* ---------- the kit, round 2: smooth, rounded, chunky ---------- */
const sm = {};
const S = (hex) => sm[hex] || (sm[hex] = new THREE.MeshLambertMaterial({ color: hex }));
const mesh = (geo, hex, x = 0, y = 0, z = 0, s = [1, 1, 1], flat = false) => { const m = new THREE.Mesh(geo, flat ? M(hex) : S(hex)); m.position.set(x, y, z); m.scale.set(s[0], s[1], s[2]); m.castShadow = true; m.receiveShadow = true; return m; };
function rbox(w, h, d, r = .08){
  const sh = new THREE.Shape(), x = -(w - 2 * r) / 2, y = -(h - 2 * r) / 2, ww = w - 2 * r, hh = h - 2 * r;
  sh.moveTo(x, y); sh.lineTo(x + ww, y); sh.lineTo(x + ww, y + hh); sh.lineTo(x, y + hh); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: Math.max(.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 3, curveSegments: 4 });
  g.translate(0, 0, -(d - 2 * r) / 2); return g;
}
function capsule(r, len){ const pts = [], n = 6; for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + i / n * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, -len / 2 + Math.sin(a) * r)); } for (let i = 0; i <= n; i++) { const a = i / n * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, len / 2 + Math.sin(a) * r)); } return new THREE.LatheGeometry(pts, 14); }
const tube = (pts, r, seg = 24) => new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), seg, r, 10, false);
const G = {
  ico1: new THREE.IcosahedronGeometry(1, 1), dodeca: new THREE.DodecahedronGeometry(1, 0), box: new THREE.BoxGeometry(1, 1, 1),
  cyl8: new THREE.CylinderGeometry(1, 1, 1, 10), cone7: new THREE.ConeGeometry(1, 1, 7), sph: new THREE.SphereGeometry(1, 20, 14),
  discs: new THREE.CylinderGeometry(1, 1, 1, 18)
};
function tree(h = 1){
  const g = new THREE.Group();
  g.add(mesh(tube([[0, 0, 0], [.08 * h, 1 * h, .05 * h], [-.05 * h, 2 * h, 0]], .17 * h, 12), C.trunk));
  g.add(mesh(G.ico1, C.seaGreen, 0, 2.15 * h, 0, [1.35 * h, 1.1 * h, 1.3 * h], true));
  g.add(mesh(G.ico1, C.sage, .55 * h, 2.9 * h, .15 * h, [.95 * h, .85 * h, .9 * h], true));
  g.add(mesh(G.ico1, C.lime, -.5 * h, 3.05 * h, -.1 * h, [.8 * h, .72 * h, .78 * h], true));
  return g;
}
function pine(h = 1){
  const g = new THREE.Group();
  g.add(mesh(G.cyl8, C.trunk, 0, .4 * h, 0, [.15 * h, .8 * h, .15 * h]));
  [[1.35, 1.5, 1.3, C.teal], [1.05, 1.4, 2.2, C.seaGreen], [.72, 1.2, 3.05, C.sage]].forEach(([r, hh, y, c]) => g.add(mesh(G.cone7, c, 0, y * h, 0, [r * h, hh * h, r * h], true)));
  return g;
}
function rock(s = 1){
  const g = new THREE.Group();
  g.add(mesh(G.ico1, rng() < .5 ? C.slate : C.mauve, 0, .5 * s, 0, [1.2 * s, .78 * s, 1 * s], true));
  g.add(mesh(G.ico1, C.sage, .05 * s, .98 * s, 0, [.78 * s, .2 * s, .66 * s], true));
  return g;
}
function bush(s = 1){ const g = new THREE.Group(); g.add(mesh(G.ico1, C.seaGreen, 0, .5 * s, 0, [.9 * s, .65 * s, .85 * s], true)); g.add(mesh(G.ico1, C.sage, .6 * s, .35 * s, .2 * s, [.55 * s, .45 * s, .55 * s], true)); return g; }
function balloon(hex){
  const g = new THREE.Group();
  g.add(mesh(G.sph, hex, 0, 0, 0, [.55, .68, .55]));
  g.add(mesh(G.cone7, hex, 0, -.74, 0, [.1, .15, .1]).rotateX(Math.PI));
  const st = mesh(G.cyl8, C.charcoal, 0, -1.8, 0, [.014, 2.0, .014]); st.castShadow = false; g.add(st);
  return g;
}
/* Cubo: a big rounded cube head, a chubby body, short round limbs */
function cubo(){
  const g = new THREE.Group(), skin = 0x8fa6ff, body = C.blue;
  const head = new THREE.Group(); head.position.y = 1.75; g.add(head);
  head.add(mesh(rbox(1.15, 1.05, 1.05, .2), skin));
  head.add(mesh(rbox(.86, .66, .06, .03), 0xdbe6ff, 0, -.02, .53));
  [-.2, .2].forEach(x => head.add(mesh(G.sph, 0x2a2160, x, .05, .575, [.07, .11, .03])));
  head.add(mesh(G.sph, 0x2a2160, 0, -.17, .575, [.09, .055, .03]));
  g.userData.head = head;
  g.add(mesh(capsule(.3, .35), body, 0, .85, 0));
  const mkArm = (side) => { const a = new THREE.Group(); a.position.set(side * .3, 1.0, 0); const arm = mesh(capsule(.09, .5), body, side * .26, .1, 0); arm.rotation.z = -side * 1.0; a.add(arm); a.add(mesh(G.sph, skin, side * .55, .28, 0, [.13, .13, .13])); return a; };
  const aL = mkArm(-1), aR = mkArm(1); g.add(aL, aR); g.userData.arms = [aL, aR];
  [-.16, .16].forEach(x => { g.add(mesh(capsule(.1, .42), body, x, .32, 0)); g.add(mesh(rbox(.28, .13, .4, .05), skin, x, .07, .07)); });
  return g;
}
function giraffe(){
  const g = new THREE.Group(), Y = C.yellow, B = 0xa8642f;
  g.add(mesh(G.sph, Y, 0, 2.35, 0, [1.15, .62, .6]));
  g.userData.legs = [];
  [[-.72, -.3], [-.72, .3], [.72, -.3], [.72, .3]].forEach(([x, z]) => { const lg = new THREE.Group(); lg.position.set(x, 1.95, z); lg.add(mesh(capsule(.12, 1.7), Y, 0, -.8, 0)); lg.add(mesh(G.sph, C.charcoal, 0, -1.83, 0, [.15, .1, .16])); g.add(lg); g.userData.legs.push(lg); });
  const neck = new THREE.Group(); neck.position.set(.8, 2.6, 0); g.add(neck);
  neck.add(mesh(tube([[0, 0, 0], [.18, 1.0, 0], [.1, 2.0, 0], [.3, 2.9, 0]], .2, 20), Y));
  const head = new THREE.Group(); head.position.set(.38, 3.0, 0); neck.add(head);
  head.add(mesh(G.sph, Y, .1, 0, 0, [.38, .3, .28]));
  head.add(mesh(G.sph, C.sandLight, .42, -.05, 0, [.2, .17, .2]));
  head.add(mesh(G.sph, C.charcoal, .6, -.03, 0, [.05, .04, .05]));
  [-.13, .13].forEach(z => { head.add(mesh(capsule(.04, .25), C.sandDark, 0, .42, z)); head.add(mesh(G.sph, C.charcoal, 0, .62, z, [.07, .07, .07])); head.add(mesh(G.sph, C.charcoal, .3, .08, z * 1.25, [.045, .055, .035])); });
  head.add(mesh(G.sph, Y, -.2, .18, .27, [.14, .07, .06])); head.add(mesh(G.sph, Y, -.2, .18, -.27, [.14, .07, .06]));
  const sp = rng; for (let i = 0; i < 12; i++) { const x = (sp() - .5) * 1.7, y = 2.3 + sp() * .45, side = sp() < .5 ? 1 : -1; g.add(mesh(G.sph, B, x, y, side * .52, [.2, .17, .05])); }
  for (let i = 0; i < 6; i++) neck.add(mesh(G.sph, B, .12 + (i % 3) * .05, .3 + i * .45, (i % 2 ? 1 : -1) * .17, [.13, .13, .05]));
  g.add(mesh(tube([[0, 0, 0], [-.3, -.4, 0], [-.4, -1.0, 0]], .04, 12), B, -1.05, 2.45, 0)); g.add(mesh(G.sph, B, -1.45, 1.45, 0, [.1, .16, .1]));
  g.userData.neck = neck; return g;
}
function pot(){
  const g = new THREE.Group(), pts = [[.0, 0], [.42, 0], [.5, .1], [.62, .75], [.56, .85], [.0, .85]].map(p => new THREE.Vector2(p[0], p[1]));
  g.add(mesh(new THREE.LatheGeometry(pts, 14), 0xe0705a));
  g.add(mesh(G.sph, C.trunk, 0, .82, 0, [.52, .1, .52]));
  for (let i = 0; i < 7; i++) { const a = i / 7 * 6.28, m = mesh(G.ico1, i % 2 ? C.seaGreen : C.sage, Math.cos(a) * .4, 1.05, Math.sin(a) * .4, [.28, .14, .2], true); m.rotation.y = -a; m.rotation.z = .5; g.add(m); }
  [[C.pink, .0, 1.3, .1], [C.yellow, .3, 1.2, -.2], [C.cream, -.3, 1.25, .15]].forEach(([c, x, y, z]) => g.add(mesh(G.sph, c, x, y, z, [.13, .1, .13])));
  return g;
}
function fence(n = 6){
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) { g.add(mesh(rbox(.34, 1.5, .1, .04), 0xa8805a, i * .46, .75, 0)); }
  g.add(mesh(rbox(n * .46 + .1, .12, .12, .04), 0x8c6a48, (n - 1) * .23, .5, -.1)); g.add(mesh(rbox(n * .46 + .1, .12, .12, .04), 0x8c6a48, (n - 1) * .23, 1.1, -.1));
  return g;
}
function slabs(){
  /* tidy paving: rows of rounded slabs with small gaps, like the Goose Game paths */
  const g = new THREE.Group(), cols = [C.sandDark, C.sand, C.sandLight, 0xa9a38f];
  for (let row = -4; row <= 4; row++) {
    let x = -9 - (row % 2 ? 1.1 : 0);
    while (x < 9) {
      const w = 1.9 + rng() * .9, cx = x + w / 2, cz = row * 2.1;
      if (Math.hypot(cx, cz) < 8.6) { const m = mesh(rbox(w - .16, .16, 1.9, .06), cols[(rng() * cols.length) | 0], cx, .06 + rng() * .025, cz); m.castShadow = false; g.add(m); }
      x += w;
    }
  }
  return g;
}


const A = () => stage.clientWidth / Math.max(1, stage.clientHeight);
const V = 6;                                     /* the flat view is 12 units tall, y from 0 (bottom) to 12 (top) */
const state = { cam: 'flat', t: 0, popped: 0 };
let look = 0, lookT = 0;

/* ---------- the world, in layers at different depths ---------- */
const layers = [];
function ridge(z, baseY, amp, freq, ph, hex, k, jag){
  const W = 70, sh = new THREE.Shape(); sh.moveTo(-W, -8);
  const f = (x) => jag ? baseY + Math.abs(Math.sin(x * freq + ph)) * amp + Math.abs(Math.sin(x * freq * 2.1 + ph * 1.7)) * amp * .5 : baseY + Math.sin(x * freq + ph) * amp + Math.sin(x * freq * 2.3 + ph * 1.7) * amp * .4;
  for (let x = -W; x <= W; x += .5) sh.lineTo(x, f(x));
  sh.lineTo(W, -8); sh.closePath();
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), S(hex)); m.position.z = z;
  const g = new THREE.Group(); g.add(m); scene.add(g);
  const L = { f, g, z, k }; layers.push(L); return L;
}
const mount = ridge(-95, 3.6, 2.2, .28, 1, C.fog, .08, true);
const h1 = ridge(-70, 3.1, .6, .22, 2, 0xa9bcae, .18);
const h2 = ridge(-45, 2.4, .7, .18, .5, C.sageLight, .32);
const h3 = ridge(-22, 1.7, .7, .15, 3.4, C.sage, .52);
const h4 = ridge(-8, 1.05, .5, .2, 5.1, 0x86b47d, .78);
const front = ridge(4, .35, .3, .3, 1.7, 0x7fa06b, 1.0);
function addTrees(L, n, a, b, pines){
  for (let i = 0; i < n; i++) {
    const x = (rng() * 2 - 1) * 24, h = a + rng() * (b - a), t = (pines && rng() < .45) ? pine(h) : tree(h);
    t.position.set(x, L.f(x) - .05, L.z + .6 + rng() * .8); t.rotation.y = rng() * 6; L.g.add(t);
  }
}
addTrees(h1, 14, .22, .38, true); addTrees(h2, 12, .3, .46, true); addTrees(h3, 9, .42, .62, true); addTrees(h4, 6, .55, .8, false);
[[h3, -12, rock], [h3, 8, rock], [h4, 13, rock], [h4, -16, bush], [h4, 5, bush]].forEach(([L, x, fn]) => { const o = fn(.65); o.position.set(x, L.f(x) - .05, L.z + 1); L.g.add(o); });

/* a smiling sun, and clouds drifting at their own speeds */
const sun = new THREE.Group();
sun.add(new THREE.Mesh(new THREE.CircleGeometry(2.6, 28), new THREE.MeshBasicMaterial({ color: 0xfff6dc, transparent: true, opacity: .45, fog: false })));
sun.add(new THREE.Mesh(new THREE.CircleGeometry(1.35, 28), new THREE.MeshBasicMaterial({ color: 0xfff0c2, fog: false })));
[-.4, .4].forEach(x => { const e = new THREE.Mesh(new THREE.CircleGeometry(.1, 10), new THREE.MeshBasicMaterial({ color: 0x8a6a3a, fog: false })); e.position.set(x, .2, .01); sun.add(e); });
const sm2 = new THREE.Mesh(new THREE.TorusGeometry(.42, .05, 6, 14, Math.PI), new THREE.MeshBasicMaterial({ color: 0x8a6a3a, fog: false })); sm2.rotation.z = Math.PI; sm2.position.set(0, -.05, .01); sun.add(sm2);
sun.position.set(0, 9.6, -125); scene.add(sun);
const clouds = [];
for (let i = 0; i < 6; i++) {
  const c = new THREE.Group(), w = .6 + rng() * .55;
  [[0, 0, 1], [-.9, -.12, .75], [.95, -.1, .8], [.3, .35, .7]].forEach(([x, y, s]) => c.add(mesh(G.sph, C.cream, x * w, y * w, 0, [s * w * 1.1, s * w * .62, s * w * .7])));
  c.position.set((rng() * 2 - 1) * 20, 6.6 + rng() * 4.4, -100 + rng() * 40); c.userData = { sp: .12 + rng() * .25 }; scene.add(c); clouds.push(c);
}
/* petals drifting past, in front of the hills */
const petals = [];
for (let i = 0; i < 16; i++) { const p = mesh(G.sph, i % 2 ? C.pink : C.cream, 0, 0, 0, [.09, .05, .07]); p.userData = { x: (rng() * 2 - 1) * 14, y: 2 + rng() * 8, sp: .4 + rng() * .6, ph: rng() * 6 }; p.position.z = 1.5 + rng() * 3; scene.add(p); petals.push(p); }

/* grass in the front: one instanced mesh, one draw call */
const TUFTS = 280, tg = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 5), new THREE.MeshLambertMaterial({ color: 0xffffff }), TUFTS);
const tuf = []; const gcols = [C.sage, C.seaGreen, C.lime, 0x6f9a63].map(h => new THREE.Color(h));
for (let i = 0; i < TUFTS; i++) { const x = (rng() * 2 - 1) * 16; tuf.push({ x, y: front.f(x) - .1 + rng() * .1, z: 5 + rng() * 3, h: .35 + rng() * .55, w: .05 + rng() * .05, ph: rng() * 6 }); tg.setColorAt(i, gcols[(rng() * gcols.length) | 0]); }
scene.add(tg);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
function tufts(t){ for (let i = 0; i < TUFTS; i++) { const u = tuf[i]; _e.set(0, 0, Math.sin(t * 1.4 + u.ph + u.x * .3) * .12 - .05); _q.setFromEuler(_e); _p.set(u.x + look * 0 , u.y + u.h / 2, u.z); _s.set(u.w, u.h, u.w); _m.compose(_p, _q, _s); tg.setMatrixAt(i, _m); } tg.instanceMatrix.needsUpdate = true; }
const flowers = new THREE.Group();
for (let i = 0; i < 16; i++) { const x = (rng() * 2 - 1) * 14, y = front.f(x), c = [C.pink, C.yellow, C.cream, C.violet][i % 4]; const f = new THREE.Group(); f.add(mesh(G.cyl8, C.seaGreen, 0, .25, 0, [.02, .5, .02])); f.add(mesh(G.sph, c, 0, .55, 0, [.12, .12, .08])); f.add(mesh(G.sph, C.yellow, 0, .55, .06, [.05, .05, .04])); f.position.set(x, y, 5.5 + rng() * 2); flowers.add(f); }
scene.add(flowers);
/* a giraffe now and then, strolling along the near hill */
const gir = giraffe(); gir.scale.setScalar(.9); gir.userData.dir = 1; gir.userData.next = 9; gir.visible = false; scene.add(gir);

/* ---------- balloons and popping ---------- */
const PAL = [C.red, C.yellow, C.cyan, C.orange, C.pink, C.violet, C.lime];
const balls = [], shards = [];
let spawnT = 0;
function spawn(initial){
  const hex = PAL[(Math.random() * PAL.length) | 0], b = balloon(hex), sc = 1.9; b.scale.setScalar(sc);
  const x = (Math.random() * 2 - 1) * 5.4 * A(), y = initial ? 2 + Math.random() * 7 : -2.6 - Math.random() * 2;
  b.position.set(x, y, 3 + Math.random() * 1.5); scene.add(b);
  balls.push({ g: b, hex, vy: .9 + Math.random() * 1.0, ph: Math.random() * 6, sc, x0: x });
}
for (let i = 0; i < 3; i++) spawn(true);
let ac = null;
function sfx(pitch){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime, len = Math.floor(ac.sampleRate * .14), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const n = ac.createBufferSource(); n.buffer = buf; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500 * pitch; f.Q.value = .8;
    const g = ac.createGain(); g.gain.value = .4; n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t);
    const o = ac.createOscillator(), og = ac.createGain(); o.frequency.setValueAtTime(520 * pitch, t); o.frequency.exponentialRampToValueAtTime(220 * pitch, t + .12);
    og.gain.setValueAtTime(.18, t); og.gain.exponentialRampToValueAtTime(.001, t + .14); o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t + .15);
  } catch (e) { /* no sound is fine */ }
}
function pop(b){
  scene.remove(b.g); balls.splice(balls.indexOf(b), 1); state.popped++; document.getElementById('popped').textContent = state.popped;
  const p = b.g.position, mat = new THREE.MeshBasicMaterial({ color: b.hex, transparent: true, fog: false });
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * 6.283, sp = 2.5 + Math.random() * 4.5, m = new THREE.Mesh(i % 3 ? G.dodeca : G.sph, mat);
    m.scale.set(.1 + Math.random() * .1, .1 + Math.random() * .1, .05); m.position.set(p.x, p.y, p.z + .5); scene.add(m);
    shards.push({ m, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 1.5, life: 0, max: .7 + Math.random() * .4, mat });
  }
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.5, .06, 6, 20), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8, fog: false }));
  ring.position.set(p.x, p.y, p.z + .6); scene.add(ring); shards.push({ m: ring, ring: true, life: 0, max: .35, mat: ring.material });
  /* the string drops away */
  const st = new THREE.Mesh(G.cyl8, S(C.charcoal)); st.scale.set(.014, 2.0, .014); st.position.set(p.x, p.y - 2.2, p.z); scene.add(st);
  shards.push({ m: st, vx: (Math.random() - .5) * .8, vy: -1, life: 0, max: 1.2, string: true, mat: st.material, keep: true });
  sfx(.85 + Math.random() * .5);
}

/* ---------- the hand: a glowing mitt that follows the pointer ---------- */
const hand = { x: 0, y: 6, tx: 0, ty: 6, on: false };
const mitt = new THREE.Group();
mitt.add(new THREE.Mesh(new THREE.CircleGeometry(.62, 24), new THREE.MeshBasicMaterial({ color: 0xff5d9e, transparent: true, opacity: .28, fog: false })));
mitt.add(new THREE.Mesh(new THREE.CircleGeometry(.3, 22), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false })));
mitt.add(new THREE.Mesh(new THREE.TorusGeometry(.3, .07, 8, 24), new THREE.MeshBasicMaterial({ color: 0xff5d9e, fog: false })));
mitt.position.z = 8; mitt.visible = false; scene.add(mitt);
function toWorld(e){ const r = stage.getBoundingClientRect(); return [((e.clientX - r.left) / r.width * 2 - 1) * V * A(), V + (1 - (e.clientY - r.top) / r.height * 2) * V]; }
function move(e){ const [x, y] = toWorld(e); hand.tx = x; hand.ty = y; if (!hand.on){ hand.x = x; hand.y = y; } hand.on = true; lookT = x / (V * A()) * 1.6; }
stage.addEventListener('pointermove', move);
stage.addEventListener('pointerdown', (e) => { move(e); sfx(1.2); });
stage.addEventListener('pointerleave', () => { hand.on = false; lookT = 0; });

/* ---------- cameras ---------- */
let camera;
function setCam(k){
  state.cam = k; const a = A();
  if (k === 'flat') { camera = new THREE.OrthographicCamera(-V * a, V * a, V, -V, 1, 700); camera.position.set(0, V, 60); camera.lookAt(0, V, 0); scene.fog.near = 70; scene.fog.far = 190; }
  else { camera = new THREE.PerspectiveCamera(40, a, .5, 700); camera.position.set(22, 9, 36); camera.lookAt(-2, 5, -20); scene.fog.near = 40; scene.fog.far = 230; }
  document.querySelectorAll('[data-cam]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cam === k)));
}
function resize(){ const dpr = Math.min(window.devicePixelRatio || 1, 2); renderer.setPixelRatio(dpr); renderer.setSize(stage.clientWidth, stage.clientHeight, false); setCam(state.cam); }
window.addEventListener('resize', resize);
document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => setCam(b.dataset.cam)));

/* ---------- the loop ---------- */
const ft = []; let rec = null, lastT = performance.now(), acc = 0, frames = 0;
const pct = (a, p) => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };
function loop(now){
  requestAnimationFrame(loop);
  const ms = now - lastT, dt = Math.min(.1, ms / 1000); lastT = now; state.t += dt; const t = state.t;
  look += (lookT - look) * Math.min(1, dt * 1.5);
  layers.forEach(L => { L.g.position.x = -look * L.k * 2; });
  sun.position.x = 4.2 * A() - look * .2;
  clouds.forEach(c => { c.position.x += c.userData.sp * dt; if (c.position.x > 24) c.position.x = -24; });
  petals.forEach(p => { const u = p.userData; u.x += u.sp * dt; if (u.x > 15) u.x = -15; p.position.x = u.x; p.position.y = u.y + Math.sin(t * 1.3 + u.ph) * .5; p.rotation.z = t + u.ph; });
  tufts(t);
  /* the giraffe's walk */
  const gu = gir.userData; gu.next -= dt;
  if (!gir.visible && gu.next <= 0) { gu.dir = Math.random() < .5 ? 1 : -1; gir.position.x = -gu.dir * (V * A() + 4); gir.visible = true; gir.rotation.y = gu.dir > 0 ? 0 : Math.PI; }
  if (gir.visible) {
    gir.position.x += gu.dir * 1.3 * dt; gir.position.z = -6; gir.position.y = h4.f(gir.position.x + look * h4.k * 2) + 0.05 + Math.abs(Math.sin(t * 5)) * .04;
    gu.legs = gir.userData.legs; gu.legs.forEach((l, i) => { l.rotation.z = Math.sin(t * 5 + (i % 2) * Math.PI) * .28; });
    gu.neck.rotation.z = Math.sin(t * 1.6) * .08;
    if (Math.abs(gir.position.x) > V * A() + 5 && gir.position.x * gu.dir > 0) { gir.visible = false; gu.next = 14 + Math.random() * 10; }
  }
  /* balloons: a few at the start, a gentle climb to a crowded sky */
  const want = Math.min(9, 3 + Math.floor(t / 7));
  spawnT -= dt; if (spawnT <= 0 && balls.length < want) { spawn(false); spawnT = .7 + Math.random() * .6; }
  for (const b of balls.slice()) {
    b.g.position.y += b.vy * dt; b.g.position.x = b.x0 + Math.sin(t * .9 + b.ph) * .35; b.g.rotation.z = Math.sin(t * 1.5 + b.ph) * .08;
    if (b.g.position.y > V * 2 + 3) { scene.remove(b.g); balls.splice(balls.indexOf(b), 1); }
  }
  /* the hand: follows the pointer, and pops whatever it sweeps through */
  if (hand.on) {
    const dx = hand.tx - hand.x, dy = hand.ty - hand.y, d = Math.hypot(dx, dy), steps = Math.max(1, Math.ceil(d / .35));
    for (let s = 1; s <= steps; s++) {
      const px = hand.x + dx * s / steps, py = hand.y + dy * s / steps;
      for (const b of balls.slice()) { const ex = (px - b.g.position.x) / (.55 * b.sc), ey = (py - b.g.position.y) / (.68 * b.sc); if (ex * ex + ey * ey < 1.5) pop(b); }
    }
    hand.x = hand.tx; hand.y = hand.ty; mitt.visible = true; mitt.position.x = hand.x; mitt.position.y = hand.y; mitt.rotation.z = t * 2;
  } else mitt.visible = false;
  /* the burst */
  for (const s of shards.slice()) {
    s.life += dt; const k = s.life / s.max;
    if (s.ring) { const sc = 1 + k * 2.2; s.m.scale.set(sc, sc, 1); s.mat.opacity = .8 * (1 - k); }
    else { s.vy = (s.vy || 0) - 9 * dt; s.m.position.x += (s.vx || 0) * dt; s.m.position.y += s.vy * dt; s.m.rotation.z += dt * 6; if (!s.string) { const sc = 1 - k * .7; s.m.scale.multiplyScalar(1 - dt * 1.6); } s.mat.opacity = Math.max(0, 1 - k * k); }
    if (k >= 1) { scene.remove(s.m); shards.splice(shards.indexOf(s), 1); }
  }
  renderer.render(scene, camera);
  ft.push(ms); if (ft.length > 120) ft.shift(); if (rec) rec.push(ms);
  acc += ms; frames++;
  if (acc > 500) {
    document.getElementById('fps').textContent = (1000 / (acc / frames)).toFixed(0);
    document.getElementById('calls').textContent = renderer.info.render.calls;
    document.getElementById('tris').textContent = renderer.info.render.triangles.toLocaleString();
    acc = 0; frames = 0;
  }
}

/* ---------- the test: 8 seconds in the current view ---------- */
let running = false;
document.getElementById('bBench').addEventListener('click', async () => {
  if (running) return; running = true;
  const btn = document.getElementById('bBench'), box = document.getElementById('results'); btn.disabled = true;
  const dbg = renderer.getContext().getExtension('WEBGL_debug_renderer_info'), gpu = dbg ? renderer.getContext().getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'hidden by the browser';
  box.classList.add('on'); box.textContent = 'Testing for 8 seconds... keep this tab in front.';
  await new Promise(r => setTimeout(r, 500)); rec = [];
  await new Promise(r => setTimeout(r, 8000));
  const a = rec; rec = null; const avg = a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
  const px = Math.round(stage.clientWidth * Math.min(window.devicePixelRatio || 1, 2)) + '×' + Math.round(stage.clientHeight * Math.min(window.devicePixelRatio || 1, 2));
  const text = ['Orlis balloon pop result', 'GPU: ' + gpu, 'Screen render: ' + px + ', view: ' + state.cam, 'Browser: ' + navigator.userAgent.slice(0, 120),
    Math.round(1000 / avg) + ' fps, slowest 5% over ' + pct(a, .95).toFixed(1) + ' ms, worst ' + Math.max(...a).toFixed(0) + ' ms, ' + renderer.info.render.calls + ' calls, ' + renderer.info.render.triangles.toLocaleString() + ' triangles'].join('\n');
  box.innerHTML = '<pre></pre><div class="row"><button id="bCopy">Copy results</button><button id="bClose">Close</button></div>';
  box.querySelector('pre').textContent = text;
  box.querySelector('#bClose').onclick = () => box.classList.remove('on');
  box.querySelector('#bCopy').onclick = async (e) => { try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied'; } catch (_) { const r = document.createRange(); r.selectNodeContents(box.querySelector('pre')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent = 'Selected: copy it'; } };
  btn.disabled = false; running = false;
});

resize(); requestAnimationFrame(loop);
window.__pop = { setCam, state, balls, hand, toWorld, pop };
})();
</script>
