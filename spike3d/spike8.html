<title>Pop Party 3D Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* A private experiment: Pop Party as a real 3D scene, no camera needed. Mouse or touch aims; click or tap pops. */
:root{ --bg:#bfdff2; --ink:#2b2750; --panel:rgba(255,255,255,.86); --accent:#6f8cff; color-scheme:light; --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }
:root[data-theme="dark"], @media (prefers-color-scheme: dark){ }
html,body{ height:100%; margin:0; background:var(--bg); overflow:hidden; font:15px/1.35 var(--font); color:var(--ink); }
#gl{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:none; }
.pill{ position:fixed; z-index:3; top:max(14px,env(safe-area-inset-top,0px)); padding:8px 16px; border-radius:999px; background:var(--panel); font:700 22px var(--font); box-shadow:0 2px 10px rgba(40,40,80,.15); }
#time{ left:50%; transform:translateX(-50%); } #score{ left:max(16px,env(safe-area-inset-left,0px)); } #fps{ right:max(16px,env(safe-area-inset-right,0px)); font:600 12px var(--font); padding:6px 10px; }
#reticle{ position:fixed; z-index:2; width:44px; height:44px; margin:-22px 0 0 -22px; border:4px solid #fff; border-radius:50%; box-shadow:0 0 0 2px rgba(80,90,200,.35), 0 0 14px rgba(111,140,255,.8); pointer-events:none; left:50%; top:50%; transition:transform .08s; }
#reticle.hot{ transform:scale(1.35); border-color:#ffd24a; }
#hint{ position:fixed; z-index:3; left:50%; bottom:max(18px,env(safe-area-inset-bottom,0px)); transform:translateX(-50%); padding:8px 16px; border-radius:999px; background:var(--panel); font:600 14px var(--font); transition:opacity .6s; }
#end{ position:fixed; z-index:4; inset:0; display:none; align-items:center; justify-content:center; background:rgba(191,223,242,.55); }
#end.on{ display:flex; } #end div{ background:var(--panel); border-radius:24px; padding:28px 36px; text-align:center; box-shadow:0 6px 30px rgba(40,40,80,.2); }
#end b{ display:block; font:800 40px var(--font); margin-bottom:6px; } #end button{ margin-top:14px; font:700 16px var(--font); padding:10px 22px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
#end button:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
#msg{ position:fixed; z-index:6; top:70px; left:16px; color:#a33; font-weight:600; }
</style>
<canvas id="gl"></canvas><div id="reticle"></div>
<div class="pill" id="score">0</div><div class="pill" id="time">2:00</div><div class="pill" id="fps"></div>
<div id="hint">Aim with the mouse or your finger. Click or tap to pop!</div>
<div id="end"><div><b id="endscore"></b><span>balloons popped</span><br><button id="again">Play again</button></div></div>
<div id="msg" hidden></div>

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now; fr.push(dt); if (fr.length > 90) fr.shift(); fpsT += dt;
  if (playing) { t += dt; if (t >= ROUND) { playing = false; $('endscore').textContent = score; $('end').classList.add('on'); } }
  const left = Math.max(0, ROUND - t); $('time').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
  wind = Math.sin(t * .5) * .6 + Math.sin(t * .83 + 2) * .4;
  if (playing && balloons.length < target() && Math.random() < dt * 2.5) newBalloon(false);
  for (let i = balloons.length - 1; i >= 0; i--) { const b = balloons[i]; b.y += b.rise * dt; const k = t * 1.4 + b.ph; b.g.position.set(b.x0 + Math.sin(k) * .7 + wind * (b.y + 4) * .06, b.y, b.z); b.g.rotation.z = Math.sin(k * 1.1) * .08 + wind * .05; const br = 1 + Math.sin(t * 2.6 + b.ph) * .03 + Math.sin(t * 5.3 + b.ph * 2) * .012; b.body.scale.set(br, 1.18 * (2 - br), br); if (b.y > 22) { scene.remove(b.g); balloons.splice(i, 1); } }
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 150) c.position.x = -150; });
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.age += dt; f.v.multiplyScalar(Math.pow(.1, dt)); f.v.y -= 2.2 * dt; f.m.position.addScaledVector(f.v, dt); f.m.rotation.x += f.r.x * dt; f.m.rotation.y += f.r.y * dt; f.m.material.opacity = Math.max(0, 1 - f.age / f.life); if (f.age > f.life) { scene.remove(f.m); f.m.material.dispose(); fx.splice(i, 1); } }
  /* the view: you stand in the meadow, and your aim looks around a little */
  cam.position.set(mouse.x * 1.2, 2.2 + mouse.y * .4, 10); cam.lookAt(mouse.x * 9, 8 + mouse.y * 5, -20);
  if (mouse.has) $('reticle').classList.toggle('hot', !!pick());
  trees.forEach(tr => { tr.rotation.y = Math.atan2(cam.position.x - tr.position.x, cam.position.z - tr.position.z) * .6; });
  R.render(scene, cam);
  if (fpsT > .5) { fpsT = 0; const a = fr.reduce((x, y) => x + y, 0) / fr.length; $('fps').textContent = Math.round(1 / a) + ' fps'; }
}
requestAnimationFrame(loop);
setTimeout(() => { $('hint').style.opacity = 0; }, 9000);
window.__pop = { balloons, pop: () => pop(balloons[0]), mouse, move };
})();
</script>
