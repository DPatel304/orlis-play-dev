<title>Orlis Balloon Pop Paper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Balloon Pop as a paper world on a locked camera, next to the game's real 2D scene for comparison. A full-screen stage with a stats card and a bar of three views. */
:root{ --ink:#2a2b32; --panel:rgba(247,244,235,.92); --line:rgba(42,43,50,.18); --accent:#3a8474; --accent-ink:#f7f4eb; --muted:#5d6068; --warn:#c2410c; --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#e7e8e1; --panel:rgba(32,33,40,.92); --line:rgba(231,232,225,.18); --accent:#8fc7a8; --accent-ink:#1d1e24; --muted:#a9acb4; color-scheme:dark; } }
:root[data-theme="dark"]{ --ink:#e7e8e1; --panel:rgba(32,33,40,.92); --line:rgba(231,232,225,.18); --accent:#8fc7a8; --accent-ink:#1d1e24; --muted:#a9acb4; color-scheme:dark; }
html,body{ height:100%; }
body{ margin:0; background:#d9dedf; color:var(--ink); font:13px/1.35 var(--font); overflow:hidden; }
#stage{ position:fixed; inset:0; touch-action:none; }
#stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.panel{ position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:3; }
#hud{ top:max(10px,env(safe-area-inset-top,0px)); left:max(16px,env(safe-area-inset-left,0px)); min-width:180px; }
#hud h1{ margin:0 0 4px; font:700 14px/1.2 var(--font); }
#hud .big{ font:700 24px/1 var(--font); font-variant-numeric:tabular-nums; } #hud .big small{ font:500 12px var(--font); color:var(--muted); margin-left:4px; }
#hud dl{ display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:6px 0 0; font-variant-numeric:tabular-nums; } #hud dt{ color:var(--muted); } #hud dd{ margin:0; text-align:right; }
#hud p{ margin:8px 0 0; color:var(--muted); max-width:200px; }
#bar{ left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px)); bottom:max(10px,env(safe-area-inset-bottom,0px)); display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
#bar > span{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
button{ font:600 12px var(--font); color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px 11px; cursor:pointer; min-height:34px; }
button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
#msg{ color:var(--warn); margin-top:6px; }
</style>
<div id="stage"><canvas id="gl"></canvas><canvas id="c2d" style="display:none"></canvas></div>
<div class="panel" id="hud">
  <h1>Balloon Pop, paper</h1>
  <div class="big"><span id="fps">--</span><small>frames/s</small></div>
  <dl><dt>Draw calls</dt><dd id="calls">--</dd><dt>Popped</dt><dd id="popped">0</dd></dl>
  <div id="msg" hidden></div>
  <p>Sweep the mouse or a finger over the balloons. Click once to turn sound on.</p>
</div>
<div class="panel" id="bar"><span>View</span>
  <button data-v="2d" aria-pressed="false">Current 2D game</button>
  <button data-v="paper" aria-pressed="true">Paper, locked camera</button>
  <button data-v="peek" aria-pressed="false">Paper, peek from the side</button>
</div>
