<title>Orlis Shapes and Skins</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One world, two views: a 2D painted TV map and a 3D pad view, both drawn from the same data. Houses are plain boxes wearing painted pictures. */
:root{ --bg:#14151a; --ink:#e9eaee; --muted:#9a9ca6; --panel:rgba(20,21,26,.78); --tv:#7fd0b0; --pad:#6f8cff; color-scheme:dark; --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font:13px/1.35 var(--font); overflow:hidden; }
#top{ position:fixed; z-index:3; top:0; left:0; right:0; height:44px; box-sizing:border-box; padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px)); display:flex; gap:6px 18px; align-items:baseline; flex-wrap:wrap; overflow:hidden; }
#top b{ font:700 14px var(--font); } #top span{ color:var(--muted); font-size:12px; }
#grid{ position:fixed; z-index:1; inset:44px 0 0 0; padding:0 max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.view{ position:relative; border:3px solid var(--c); border-radius:18px; overflow:hidden; min-width:0; min-height:0; background:#222; touch-action:none; }
#tv{ --c:var(--tv); } #pad{ --c:var(--pad); }
.view canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.tag{ position:absolute; left:12px; top:10px; z-index:2; padding:4px 9px; border-radius:999px; background:var(--panel); font:600 12px var(--font); }
.ctl{ position:absolute; z-index:2; bottom:10px; display:grid; grid-template-columns:repeat(3,38px); grid-template-rows:repeat(2,38px); gap:5px; }
.ctl.l{ left:10px; } .ctl.r{ right:10px; }
.ctl button, .sw{ font:700 15px var(--font); color:var(--ink); background:var(--panel); border:1px solid rgba(255,255,255,.22); border-radius:10px; cursor:pointer; padding:0; touch-action:none; -webkit-user-select:none; user-select:none; }
.ctl button.on, .ctl button:active{ background:var(--c); color:#14151a; }
.ctl .up{ grid-column:2; grid-row:1; } .ctl .lf{ grid-column:1; grid-row:2; } .ctl .dn{ grid-column:2; grid-row:2; } .ctl .rt{ grid-column:3; grid-row:2; }
.sw{ position:absolute; z-index:2; left:50%; transform:translateX(-50%); bottom:10px; font:600 12px var(--font); padding:8px 12px; }
button:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
#lk{ position:fixed; z-index:5; inset:44px 0 0 0; padding:0 max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); background:var(--bg); display:none; grid-template-columns:1fr 1fr; gap:10px; }
#lk.on{ display:grid; }
#lk .view{ --c:var(--tv); } #lk .view.b{ --c:var(--pad); }
#lkbtn{ margin-left:auto; font:600 12px var(--font); color:var(--ink); background:var(--panel); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:5px 12px; cursor:pointer; }
@media (max-width:700px){ #lk{ grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
#msg{ position:fixed; z-index:4; top:52px; left:16px; color:#ffb4a2; }
@media (max-width:700px){ #grid{ grid-template-columns:1fr; grid-template-rows:1fr 1.2fr; gap:8px; } .ctl{ grid-template-columns:repeat(3,34px); grid-template-rows:repeat(2,34px); } #top span.hint{ display:none; } }
</style>
<div id="top"><b>Orlis &middot; shapes and skins</b><span>One world, two views. Houses are plain boxes wearing painted pictures.</span><span class="hint">Walk: W A S D or arrow keys, or the pad buttons</span><button id="lkbtn" aria-pressed="false">Look check</button></div>
<div id="msg" hidden></div>
<div id="lk"><section class="view"><canvas id="lk2d"></canvas><div class="tag">2D painter &middot; same assets</div></section><section class="view b"><canvas id="lk3d"></canvas><div class="tag">3D &middot; boxes and cutouts, same assets</div></section></div>
<main id="grid">
  <section class="view" id="tv"><canvas id="c2d"></canvas><div class="tag">TV &middot; 2D painted map</div></section>

    <div class="ctl l"><button class="lf" data-k="left" aria-label="Turn left">&#9664;</button><button class="rt" data-k="right" aria-label="Turn right">&#9654;</button></div>
    <button class="sw" id="sw" aria-label="Switch camera">Switch camera</button>
    <div class="ctl r"><button class="up" data-k="up" aria-label="Walk forward">&#9650;</button><button class="dn" data-k="down" aria-label="Walk back">&#9660;</button></div></section>
