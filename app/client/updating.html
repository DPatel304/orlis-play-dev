  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: #f4f5f9; color: #1d1b2e; user-select: none; cursor: default;
    font-family: "Outfit", "Segoe UI", system-ui, sans-serif;
  }
  svg.hop { width: 96px; height: 96px; overflow: visible; }
  .b { fill: #3da9ff; transform-box: fill-box; transform-origin: 50% 100%; animation: hopb 1.5s cubic-bezier(.2,.8,.25,1) infinite; }
  .v { fill: #8b5cf6; transform-box: fill-box; transform-origin: center; animation: hopv 1.5s cubic-bezier(.2,.8,.25,1) infinite; }
  @keyframes hopv { 0% { transform: translate(-34%,-10%) rotate(-12deg); } 35% { transform: translate(-12%,-50%) rotate(2deg); } 58%,100% { transform: translate(0,0) rotate(10deg); } }
  @keyframes hopb { 0%,52% { transform: scale(1,1); } 62% { transform: scale(1.06,.92); } 80%,100% { transform: scale(1,1); } }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .bar { width: 220px; height: 8px; border-radius: 99px; background: #e2e4ee; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 4%; border-radius: 99px; background: linear-gradient(120deg, #3da9ff, #8b5cf6); transition: width .25s ease; }
  @media (prefers-reduced-motion: reduce) { .b, .v { animation: none; } }
</style>
</head>
<body>
  <svg class="hop" viewBox="0 0 100 100" aria-hidden="true"><rect class="b" x="14" y="42" width="56" height="56" rx="15"/><rect class="v" x="44" y="10" width="46" height="46" rx="13"/></svg>
  <h1>Updating, back in a moment</h1>
  <div class="bar"><i id="fill"></i></div>
  <script>
    window.progress = (k) => { document.getElementById('fill').style.width = Math.max(4, Math.min(100, k * 100)) + '%'; };
  </script>
</body>
</html>
