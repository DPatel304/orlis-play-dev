[package]
name = "orlis-pad-hub"
version = "0.1.0"
description = "The pad hub of Orlis Play: serves the phone pad page and relays between phones and the game (docs/specs/pad-protocol.md)"
edition = "2021"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "fs", "macros"] }
serde_json = "1"
getrandom = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"
